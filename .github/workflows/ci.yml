# CI — build the library and run the unit suite on Linux and Windows (MinGW).
# implements: REQ-BUILD-002, REQ-BUILD-006 (the build-switch legs),
#             REQ-BUILD-007 (the OpenSSL backend legs)
#
# Besides the default configure, each platform builds two non-default switch
# sets (REQ-BUILD-006): shared-only with hem-tool on the shared SDK, and
# static-only — the unit suite + gates run on both, and the link result is
# asserted. The OpenSSL legs (REQ-BUILD-007: Linux gcc + clang against the
# distro's libssl-dev, Windows against MSYS2's openssl) run the same suite —
# gates and the consumer gate included — on the other crypto backend. EHEM_DEPS_LINK=static has no leg here: Ubuntu's libcurl has no
# static closure (libnghttp2, libidn2, … ship no archives), and the
# configuration MSYS2 could link would put wolfSSL inside the binaries, which
# no published package of this project does — the static dependency link is
# exercised by the release workflow's OpenSSL builds (REQ-BUILD-009).
#
# Only the `unit` label runs here: integration tests need the dev-machine HEM
# and stay local (REQ-TEST-002 gates them on EHEM_TEST_URL, which CI never
# sets); dangerous tests never run automatically. See ARCHITECTURE.md §9.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (${{ matrix.cc }}${{ matrix.variant && format(', {0}', matrix.variant) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        # The explicit empty variant makes each include below a NEW leg — an
        # include that overwrites no original value would otherwise be merged
        # into the default gcc leg.
        variant: ['']
        include:
          - cc: gcc
            variant: shared-only, hem-tool on the shared SDK
            cmake_args: -DEHEM_BUILD_STATIC=OFF -DEHEM_TOOL_LINK=shared
          - cc: gcc
            variant: static-only
            cmake_args: -DEHEM_BUILD_SHARED=OFF
          - cc: gcc
            variant: OpenSSL
            cmake_args: -DEHEM_CRYPTO_BACKEND=openssl
          - cc: clang
            variant: OpenSSL
            cmake_args: -DEHEM_CRYPTO_BACKEND=openssl
    steps:
      - uses: actions/checkout@v5

      # Dogfood the project's own installer (keeps it honest). wolfSSL (the
      # crypto shim dependency, REQ-AUTH-001) is required from M2 on, so the
      # crypto packages are installed too (no --no-crypto).
      - name: Install dependencies
        run: ./scripts/install-deps-linux.sh --yes

      - name: Install OpenSSL development files (OpenSSL legs)
        if: contains(matrix.cmake_args, 'EHEM_CRYPTO_BACKEND=openssl')
        run: sudo apt-get install -y --no-install-recommends libssl-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_C_COMPILER=${{ matrix.cc }} ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build -L unit --output-on-failure

      # REQ-BUILD-006: the switch legs link what they say.
      - name: Assert the link result (switch legs)
        if: matrix.cmake_args
        run: |
          fail() { echo "::error::$*"; exit 1; }
          cmake --install build --prefix "$RUNNER_TEMP/inst"
          find "$RUNNER_TEMP/inst" -name 'libencedo-hem*' | sort
          objdump -p build/hem-tool | grep NEEDED
          case "${{ matrix.cmake_args }}" in
            *EHEM_CRYPTO_BACKEND=openssl*)
              objdump -p build/hem-tool | grep -q 'NEEDED.*libcrypto\.so' \
                || fail "hem-tool does not link OpenSSL's libcrypto"
              if objdump -p build/hem-tool | grep -q 'NEEDED.*libwolfssl'; then
                fail "hem-tool links libwolfssl on the OpenSSL backend"
              fi ;;
            *EHEM_TOOL_LINK=shared*)
              objdump -p build/hem-tool | grep -q 'NEEDED.*libencedo-hem\.so' \
                || fail "hem-tool does not link libencedo-hem"
              if find "$RUNNER_TEMP/inst" -name 'libencedo-hem*.a' | grep -q .; then
                fail "a static SDK was installed"
              fi ;;
            *EHEM_BUILD_SHARED=OFF*)
              if find build "$RUNNER_TEMP/inst" -name 'libencedo-hem.so*' | grep -q .; then
                fail "a shared SDK was built"
              fi
              find "$RUNNER_TEMP/inst" -name 'libencedo-hem.a' | grep -q . \
                || fail "no static SDK installed" ;;
          esac

  # Re-enabled 2026-07-16: the X25519 crash was a missing wolfCrypt_Init()
  # (required on Windows for wolfSSL's global RNG mutex, which the default-on
  # curve25519 blinding locks on every call) — not a broken package. Post-mortem
  # in KNOWN-ISSUES.md.
  # MSYS2 environment UCRT64 since 2026-10-10 (user decision; MSYS2 and
  # setup-msys2 deprecated MINGW64): the same MinGW-w64 GCC, linked against the
  # Universal C Runtime instead of msvcrt. The job name stays "Windows (MinGW)"
  # so the check name is stable.
  windows-mingw:
    name: Windows (MinGW${{ matrix.variant && format(', {0}', matrix.variant) || '' }})
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}          # every run step executes in the MSYS2 shell
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: ''
          - variant: shared-only, hem-tool on the shared SDK
            cmake_args: -DEHEM_BUILD_STATIC=OFF -DEHEM_TOOL_LINK=shared
          - variant: static-only
            cmake_args: -DEHEM_BUILD_SHARED=OFF
          - variant: OpenSSL
            cmake_args: -DEHEM_CRYPTO_BACKEND=openssl
    steps:
      - uses: actions/checkout@v5

      - name: Set up MSYS2 / MinGW-w64 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # Explicit package list (pinning the toolset we build against —
          # §12 risk 5); `:p` adds the environment's package prefix
          # (mingw-w64-ucrt-x86_64-*). scripts/install-deps-windows.ps1 and
          # `./dev install-dependencies` cover the same set locally.
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            pkgconf:p
            curl:p
            cmocka:p
            wolfssl:p
            openssl:p

      - name: Configure
        run: cmake -B build -G Ninja ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build -L unit --output-on-failure

      # REQ-BUILD-006: the switch legs link what they say.
      - name: Assert the link result (switch legs)
        if: matrix.cmake_args
        run: |
          fail() { echo "::error::$*"; exit 1; }
          cmake --install build --prefix "$RUNNER_TEMP/inst"
          find "$RUNNER_TEMP/inst" -iname '*encedo-hem*' | sort
          objdump -p build/hem-tool.exe | grep 'DLL Name'
          case "${{ matrix.cmake_args }}" in
            *EHEM_CRYPTO_BACKEND=openssl*)
              objdump -p build/hem-tool.exe | grep -qi 'DLL Name: libcrypto-3' \
                || fail "hem-tool.exe does not import OpenSSL's libcrypto"
              if objdump -p build/hem-tool.exe | grep -qi 'DLL Name: libwolfssl'; then
                fail "hem-tool.exe imports libwolfssl on the OpenSSL backend"
              fi ;;
            *EHEM_TOOL_LINK=shared*)
              objdump -p build/hem-tool.exe | grep -qi 'DLL Name: libencedo-hem\.dll' \
                || fail "hem-tool.exe does not import libencedo-hem.dll"
              if find "$RUNNER_TEMP/inst" -name 'libencedo-hem.a' | grep -q .; then
                fail "a static SDK was installed"
              fi ;;
            *EHEM_BUILD_SHARED=OFF*)
              if find build "$RUNNER_TEMP/inst" -name 'libencedo-hem.dll*' | grep -q .; then
                fail "a shared SDK was built"
              fi
              find "$RUNNER_TEMP/inst" -name 'libencedo-hem.a' | grep -q . \
                || fail "no static SDK installed" ;;
          esac
